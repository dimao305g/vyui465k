<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff Clicker & Roulette</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            /* Полностью запрещаем выделение текста, чтобы клики не ломались */
            user-select: none;
            -webkit-user-select: none;
            -touch-callout: none;
        }

        body {
            background: radial-gradient(circle, #1a0b36 0%, #06030a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            /* Запрещаем стандартные жесты обновления страницы свайпом */
            overscroll-behavior-y: contain;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .balance-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 40px;
            border-radius: 16px;
            border: 2px solid #cb11ab;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(203, 17, 171, 0.2);
            text-align: center;
        }
        
        .balance-container span {
            color: #2ed573;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .game-grid {
                grid-template-columns: 1fr 1fr;
            }
            .click-section {
                grid-column: span 2;
                display: flex;
                justify-content: center;
            }
        }

        .click-section {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* Мгновенная кнопка клика */
        .click-area {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #cb11ab 0%, #ff4757 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(203, 17, 171, 0.5);
            transition: transform 0.05s;
            border: 4px solid #fff;
            /* Убираем задержку тапа на смартфонах */
            touch-action: manipulation;
        }

        .click-area:active {
            transform: scale(0.92);
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }

        .panel h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #ffd700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-plus { background: #2ed573; }
        .btn-minus { background: #ff4757; }
        .btn-reset { background: #57606f; }

        .upgrade-info {
            font-size: 0.9rem;
            color: #a4b0be;
            margin-bottom: 12px;
        }

        .btn-upgrade {
            background: linear-gradient(135deg, #1e90ff 0%, #70a1ff 100%);
        }
        .btn-upgrade:disabled {
            background: #2f3542;
            color: #747d8c;
            cursor: not-allowed;
        }

        .roulette-status {
            height: 24px;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Супер Высокоскоростной Кликер</h1>

    <div class="balance-container">
        Баланс: <span id="balance">0</span> ₽
    </div>

    <div class="game-grid">
        
        <div class="click-section">
            <div class="click-area" id="click-btn">КЛИК!</div>
        </div>

        <div class="panel">
            <h2>🎰 Рулетка Удачи</h2>
            <button class="btn btn-plus" onclick="playRoulette('plus100')">+100 ₽ (50%)</button>
            <button class="btn btn-plus" onclick="playRoulette('plus1000')">+1000 ₽ (25%)</button>
            <button class="btn btn-plus" onclick="playRoulette('x2')">Удвоить x2 (45%)</button>
            <button class="btn btn-minus" onclick="playRoulette('minus100')">-100 ₽ (50%)</button>
            <button class="btn btn-minus" onclick="playRoulette('minus1000')">-1000 ₽ (50%)</button>
            <button class="btn btn-reset" onclick="playRoulette('clear')">💥 Слить всё (100%)</button>
            <div class="roulette-status" id="roulette-msg"></div>
        </div>

        <div class="panel">
            <h2>🛒 Магазин Апгрейдов</h2>
            
            <div class="upgrade-info">
                Текущий клик: <strong id="click-power-view">1</strong> ₽<br>
                Автокликер: <strong id="auto-click-view">0</strong> ₽/сек
            </div>

            <button class="btn btn-upgrade" id="buy-multiplier" onclick="buyUpgrade('multiplier')">
                +1 к клику (Цена: <span id="mult-cost">15</span> ₽)
            </button>

            <button class="btn btn-upgrade" id="buy-auto" onclick="buyUpgrade('auto')">
                +1 ₽ в сек (Цена: <span id="auto-cost">50</span> ₽)
            </button>
        </div>

    </div>

    <script>
        let balance = 0;
        let clickPower = 1;
        let autoIncome = 0;

        let costs = {
            multiplier: 15,
            auto: 50
        };

        const balanceEl = document.getElementById('balance');
        const clickBtn = document.getElementById('click-btn');
        const clickPowerView = document.getElementById('click-power-view');
        const autoClickView = document.getElementById('auto-click-view');
        const multCostEl = document.getElementById('mult-cost');
        const autoCostEl = document.getElementById('auto-cost');
        const rouletteMsg = document.getElementById('roulette-msg');

        function updateDisplay() {
            balanceEl.innerText = Math.floor(balance);
            clickPowerView.innerText = clickPower;
            autoClickView.innerText = autoIncome;
            multCostEl.innerText = costs.multiplier;
            autoCostEl.innerText = costs.auto;

            document.getElementById('buy-multiplier').disabled = balance < costs.multiplier;
            document.getElementById('buy-auto').disabled = balance < costs.auto;
        }

        // Использование pointerdown дает мгновенный отклик без блокировок браузера
        clickBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Предотвращает ложные выделения и зум
            balance += clickPower;
            updateDisplay();
        });

        function buyUpgrade(type) {
            if (type === 'multiplier' && balance >= costs.multiplier) {
                balance -= costs.multiplier;
                clickPower += 1;
                costs.multiplier = Math.round(costs.multiplier * 1.5);
            } else if (type === 'auto' && balance >= costs.auto) {
                balance -= costs.auto;
                autoIncome += 1;
                costs.auto = Math.round(costs.auto * 1.6);
            }
            updateDisplay();
        }

        setInterval(() => {
            if (autoIncome > 0) {
                balance += autoIncome;
                updateDisplay();
            }
        }, 1000);

        function playRoulette(action) {
            let roll = Math.random() * 100;
            let success = false;
            let msg = "";

            if (action === 'plus100') {
                if (roll < 50) { balance += 100; success = true; msg = "Выиграл +100 ₽!"; }
                else { msg = "Не повезло!"; }
            } 
            else if (action === 'plus1000') {
                if (roll < 25) { balance += 1000; success = true; msg = "ОГО! Выиграл +1000 ₽!"; }
                else { msg = "Мимо! Попробуй еще."; }
            } 
            else if (action === 'x2') {
                if (roll < 45) { balance *= 2; success = true; msg = "Удвоение! Баланс x2!"; }
                else { msg = "Сорвалось!"; }
            } 
            else if (action === 'minus100') {
                if (roll < 50) { balance = Math.max(0, balance - 100); msg = "Потеряно -100 ₽!"; }
                else { success = true; msg = "Пронесло! Баланс цел."; }
            } 
            else if (action === 'minus1000') {
                if (roll < 50) { balance = Math.max(0, balance - 1000); msg = "Жестко! Потеряно -1000 ₽!"; }
                else { success = true; msg = "Удача! Деньги на месте."; }
            } 
            else if (action === 'clear') {
                balance = 0;
                msg = "Вы обнулили всё!";
            }

            rouletteMsg.style.color = success ? "#2ed573" : "#ff4757";
            rouletteMsg.innerText = msg;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
