<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для любимой Мамы ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffeef8 0%, #ffd3eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Эффект 3D */
        }

        /* Контейнер открытки */
        .card-container {
            position: relative;
            width: 380px;
            height: 280px;
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        /* Конверт */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff7597;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 35px rgba(255, 117, 151, 0.3);
            z-index: 2;
        }

        /* Верхний клапан конверта */
        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 190px solid transparent;
            border-right: 190px solid transparent;
            border-top: 140px solid #ff4d79;
            transform-origin: top;
            transition: transform 0.4s ease 0.2s, z-index 0.2s ease 0.2s;
            z-index: 4;
        }

        /* Передние стенки конверта (эффект кармашка) */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 190px solid #ff8da9;
            border-right: 190px solid transparent;
            border-top: 140px solid transparent;
            border-bottom: 140px solid #ff8da9;
            border-radius: 0 0 0 12px;
            z-index: 3;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: transparent;
            border-right: 190px solid #ff8da9;
            border-top: transparent;
            border-bottom: 140px solid #ff8da9;
            border-radius: 0 0 12px 0;
            z-index: 3;
        }

        /* Само письмо прячется внутри */
        .letter {
            position: absolute;
            bottom: 5px;
            left: 20px;
            width: 340px;
            height: 250px;
            background: white;
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            transition: transform 0.5s ease;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .letter h2 {
            color: #d81b60;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .letter p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Иконка сердца на конверте */
        .heart-sticker {
            position: absolute;
            top: 110px;
            left: 165px;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 5;
            transition: transform 0.3s ease;
        }

        /* АНИМАЦИЯ ОТКРЫТИЯ (когда добавлен класс .open) */
        .card-container.open .flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .card-container.open .letter {
            transform: translateY(-130px);
            z-index: 3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .card-container.open .heart-sticker {
            transform: scale(0);
        }

        /* Летающие сердечки вокруг */
        .floating-heart {
            position: absolute;
            color: #ff4d79;
            pointer-events: none;
            animation: floatUp 4s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card-container" id="card" onclick="toggleCard()">
        <div class="flap"></div>
        <div class="envelope"></div>
        <div class="heart-sticker">❤️</div>
        
        <!-- Текст письма (можешь изменить на свой!) -->
        <div class="letter">
            <h2>Любимой Мамочке! 💕</h2>
            <p>Спасибо тебе за твою доброту, заботу и поддержку. Ты самая лучшая мама на свете! Я тебя очень сильно люблю! 🥰</p>
        </div>
    </div>

    <script>
        // Функция открытия/закрытия конверта при клике
        function toggleCard() {
            document.getElementById('card').classList.toggle('open');
        }

        // Автоматическое создание летающих сердечек на фоне
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            
            document.body.appendChild(heart);
            
            // Удаляем сердечко после улета, чтобы ПК не лагал
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Спавним сердечки каждые 400 миллисекунд
        setInterval(createHeart, 400);
    </script>
</body>
</html>
